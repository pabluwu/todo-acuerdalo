services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-acuerdalo}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-acuerdalo}
      POSTGRES_DB: ${DB_NAME:-acuerdalo}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-acuerdalo} -d ${DB_NAME:-acuerdalo}"]
      interval: 5s
      timeout: 5s
      retries: 10

  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports:
      - "8025:8025"

  backend:
    build: ./backend
    restart: unless-stopped
    env_file: .env
    environment:
      PORT: 3001
      UPLOAD_DIR: /app/uploads
      APP_TIMEZONE: ${APP_TIMEZONE:-America/Santiago}
    depends_on:
      db:
        condition: service_healthy
      mailpit:
        condition: service_started
    volumes:
      - uploads:/app/uploads
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3001/api/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  frontend:
    build: ./frontend
    restart: unless-stopped
    environment:
      BACKEND_URL: http://backend:3001
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  pgdata:
  uploads:
